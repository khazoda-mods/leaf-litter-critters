modLoader = "javafml"
loaderVersion = "[4,)"
license = "${license}"
issueTrackerURL = "${issues}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
displayURL = "${homepage}"
authors = "${authors}"
description = '''${description}'''
issueTrackerURL = "${issues}"
logoFile = "${banner}"
logoBlur = false
${ neoforge_branding }

[[dependencies.${ id }]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge}"
ordering = "NONE"
side = "${neoforge_side}"

[[dependencies.${ id }]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_minecraft}"
ordering = "NONE"
side = "${neoforge_side}"

[[dependencies.${ id }]]
modId = "khazodacore"
type = "required"
versionRange = "[${khazodacore},)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "${mixins}"

[modproperties.${ id }]
catalogueImageIcon = "${icon}"
catalogueBackground = "${background}"
